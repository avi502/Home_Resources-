version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: homeresource_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=HomeResource
      - ENVIRONMENT=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-default-insecure-secret-change-me-32-chars-min}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-homeresource}
      - BACKEND_CORS_ORIGINS=["http://localhost","https://localhost","http://localhost:80"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homeresource_net

  postgres:
    image: postgres:16-alpine
    container_name: homeresource_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-homeresource}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homeresource_net

  nginx:
    image: nginx:alpine
    container_name: homeresource_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - homeresource_net

networks:
  homeresource_net:
    driver: bridge

volumes:
  postgres_data:
